<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgendaRecap Pro - Offline Shell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0A0A0B;
      color: #F4F4F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(16px);
    }
    .icon-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px auto;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 10px; color: #FFFFFF; letter-spacing: -0.5px; }
    p { font-size: 13px; color: #A1A1AA; line-height: 1.6; margin-bottom: 20px; }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      color: #FFFFFF;
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      transition: all 0.2s ease;
    }
    button:active { transform: scale(0.98); opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <h1>Mode Offline - AgendaRecap</h1>
    <p>Koneksi internet terputus. Namun seluruh pengingat yang telah dijadwalkan tetap aman dan akan berbunyi tepat waktu di perangkat Anda.</p>
    <div class="badge">✓ Native Android Alarm Engine Aktif 100%</div>
    <button onclick="checkConnection()">Coba Muat Ulang</button>
  </div>

  <script>
    function checkConnection() {
      if (navigator.onLine) {
        window.location.href = "https://agendarecap.vercel.app";
      } else {
        alert("Perangkat Anda masih offline. Pengingat lokal tetap terjadwal secara native.");
      }
    }

    window.addEventListener('online', function() {
      window.location.href = "https://agendarecap.vercel.app";
    });
  </script>
</body>
</html>
